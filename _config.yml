title: From CV to Site
subtitle: An open-source guide and starter for academics building a personal or lab website with AI.
description: An open-source guide and starter for academics building a personal or lab website with AI.
url: https://hakeounglee.github.io
baseurl: /from-cv-to-site
repository: HakeoungLee/from-cv-to-site

remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: default

masthead_title: "From CV to Site"

words_per_minute: 220
search: true
search_full_content: true

author:
  name: "Hakeoung Hannah Lee"
  bio: "Assistant Professor, University of Virginia."
  location: "Charlottesville, VA"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://mltilab.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/HakeoungLee"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/HakeoungLee/from-cv-to-site"
    - label: "Live example"
      icon: "fas fa-fw fa-link"
      url: "https://mltilab.com"

exclude:
  - starter/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - "*.docx"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-relative-links
  - jekyll-feed

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
      read_time: true
      toc: true
      toc_sticky: true
  - scope:
      path: "tutorials"
    values:
      layout: single
      author_profile: true
      read_time: true
      toc: true
      toc_sticky: true
      toc_label: "On this page"

permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
